
html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meteo Pro Live</title>
    
    <meta name="theme-color" content="#1a2a6c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meteo Pro">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a2a6c'/><text y='.8em' x='10' font-size='80'>🌍</text></svg>">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .search-box { display: flex; justify-content: space-between; margin-bottom: 15px; }
        input { padding: 12px; border-radius: 15px; border: none; width: 70%; font-size: 1em; outline: none; }
        button.search-btn { padding: 12px; border-radius: 15px; border: none; background: #ffdb58; color: #333; font-weight: bold; width: 25%; cursor: pointer; }

        /* MENU A SCHEDE */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;}
        .tab { font-size: 1.1em; cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .tab.active { opacity: 1; font-weight: bold; border-bottom: 2px solid white; padding-bottom: 5px; }

        .tab-content { display: none; flex-grow: 1; overflow-y: auto; text-align: center; }
        .tab-content.active { display: block; }

        /* SCHEDA METEO */
        .city-name { font-size: 2em; font-weight: 600; margin-top: 10px; }
        .temp { font-size: 4em; font-weight: bold; margin: 10px 0; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .detail-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; font-size: 0.9em; }

        /* TASTO AGGIORNA */
        .refresh-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            margin-top: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* SCHEDA RADAR E WEBCAM */
        iframe { width: 100%; height: 350px; border-radius: 15px; border: none; background: rgba(0,0,0,0.2); }
        .cam-title { margin: 10px 0; font-size: 1.1em; font-weight: bold; }

        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Barra di Ricerca -->
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Cerca città..." onkeypress="if(event.key === 'Enter') getWeather()" />
            <button class="search-btn" onclick="getWeather()">Cerca</button>
        </div>

        <!-- Menu Schede -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('meteo')">Meteo</div>
            <div class="tab" onclick="switchTab('radar')">Radar 📡</div>
            <div class="tab" onclick="switchTab('webcam')">Live 🔴</div>
        </div>

        <!-- Contenuto Meteo -->
        <div id="meteo" class="tab-content active">
            <p id="loading">Sincronizzazione dati live... ⏳</p>
            <div id="weather-data" style="display: none;">
                <div class="city-name" id="city-display">Arzano</div>
                <div class="temp" id="temp-display">--°</div>
                <div style="font-size: 1.2em;" id="condition-display">--</div>
                
                <div class="details-grid">
                    <div class="detail-box">💨 Vento<br><strong id="wind-display">--</strong></div>
                    <div class="detail-box">❄️ Neve (Oggi)<br><strong id="snow-display">--</strong></div>
                </div>
                
                <!-- Tasto di aggiornamento in tempo reale -->
                <button class="refresh-btn" onclick="getWeather()">Aggiorna Ora 🔄</button>
            </div>
        </div>

        <!-- Contenuto Radar -->
        <div id="radar" class="tab-content">
            <p style="margin-top:0; font-size: 0.9em; opacity: 0.8;">Radar Precipitazioni in tempo reale</p>
            <iframe id="radar-iframe" src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=7&overlay=rain&product=ecmwf&level=surface&lat=40.8&lon=14.2" allowfullscreen></iframe>
        </div>

        <!-- Contenuto Webcam -->
        <div id="webcam" class="tab-content">
            <div class="cam-title">🔴 Notizie Live (SkyTG24)</div>
            <iframe src="https://www.youtube.com/embed/B_QeYF8nL6w?autoplay=1&mute=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="height: 200px;"></iframe>
            
            <div class="cam-title">🌋 Vesuvio / Etna</div>
            <div class="detail-box">Per inserire altre telecamere live basterà incollare qui il link di YouTube nel codice!</div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function getWeather() {
            // Se la casella è vuota, di default cerca ad Arzano
            const cityInput = document.getElementById('city-input').value;
            const city = cityInput ? cityInput : 'Arzano';
            
            document.getElementById('weather-data').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                // 1. Trova Coordinate (API Geocoding)
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=it`);
                const geoData = await geoRes.json();
                
                if (!geoData.results) { alert("Città non trovata! Prova a scrivere il nome in modo diverso."); return; }
                
                const lat = geoData.results[0].latitude;
                const lon = geoData.results[0].longitude;
                const cityName = geoData.results[0].name;

                // 2. Aggiorna Radar
                document.getElementById('radar-iframe').src = `https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km%2Fh&zoom=7&overlay=rain&product=ecmwf&level=surface&lat=${lat}&lon=${lon}`;

                // 3. Scarica Meteo in tempo reale (forzato)
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=snowfall_sum&timezone=auto`);
                const weatherData = await weatherRes.json();
                const current = weatherData.current_weather;
                const snow = weatherData.daily.snowfall_sum[0]; 

                // 4. Stampa i risultati
                document.getElementById('city-display').innerText = cityName;
                document.getElementById('temp-display').innerText = Math.round(current.temperature) + '°';
                document.getElementById('wind-display').innerText = current.windspeed + ' km/h';
                document.getElementById('snow-display').innerText = snow > 0 ? snow + ' cm' : 'Assente';
                
                // Icone Condizioni
                const code = current.weathercode;
                let condition = "Sereno ☀️";
                if(code >= 1 && code <= 3) condition = "Nuvoloso ☁️";
                if(code >= 45 && code <= 48) condition = "Nebbia 🌫️";
                if(code >= 51 && code <= 67) condition = "Pioggia 🌧️";
                if(code >= 71 && code <= 77) condition = "Neve ❄️";
                if(code >= 95) condition = "Temporale ⛈️";
                document.getElementById('condition-display').innerText = condition;
                
                // Rimuovi scritta caricamento e mostra i dati freschi
                document.getElementById('loading').style.display = 'none';
                document.getElementById('weather-data').style.display = 'block';
            } catch (error) {
                alert("Nessuna connessione. Controlla internet e riprova.");
                document.getElementById('loading').style.display = 'none';
                document.getElementById('weather-data').style.display = 'block';
            }
        }
        
        getWeather();
    </script>
</body>
</html
