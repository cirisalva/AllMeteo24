<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meteo App</title>
    
    <!-- IMPOSTAZIONI PWA E ICONA -->
    <meta name="theme-color" content="#4facfe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meteo">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%234facfe'/><text y='.8em' x='10' font-size='80'>☀️</text></svg>">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .weather-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            width: 85%;
            max-width: 350px;
        }
        .search-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        input {
            padding: 15px;
            border-radius: 20px;
            border: none;
            width: 65%;
            font-size: 1em;
            outline: none;
            background: rgba(255,255,255,0.9);
        }
        button {
            padding: 15px;
            border-radius: 20px;
            border: none;
            background: #ffdb58;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            width: 30%;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(255, 219, 88, 0.4);
        }
        .city-name { font-size: 2em; font-weight: 600; }
        .temp { font-size: 4.5em; font-weight: bold; margin: 10px 0; text-shadow: 2px 4px 10px rgba(0,0,0,0.2); }
        .condition { font-size: 1.3em; margin-bottom: 20px; }
        .details { background: rgba(0,0,0,0.1); padding: 15px; border-radius: 15px; display: flex; justify-content: space-around; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="weather-container">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Città..." onkeypress="if(event.key === 'Enter') getWeather()" />
            <button onclick="getWeather()">Cerca</button>
        </div>
        
        <div id="weather-result" style="display: none;">
            <div class="city-name" id="city-display">Napoli</div>
            <div class="temp" id="temp-display">--°</div>
            <div class="condition" id="condition-display">--</div>
            <div class="details">
                <span id="wind-display">💨 Vento: -- km/h</span>
            </div>
        </div>
        <p id="loading" style="display:none; font-size: 1.2em;">Cerco nel cielo... ☁️</p>
    </div>

    <script>
        async function getWeather() {
            const cityInput = document.getElementById('city-input').value;
            const city = cityInput ? cityInput : 'Napoli'; // Predefinito se lasciato vuoto
            
            document.getElementById('weather-result').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                // 1. Trova le coordinate della città
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=it`);
                const geoData = await geoRes.json();
                
                if (!geoData.results || geoData.results.length === 0) {
                    alert("Città non trovata! Riprova con un altro nome.");
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                const lat = geoData.results[0].latitude;
                const lon = geoData.results[0].longitude;
                const cityName = geoData.results[0].name;

                // 2. Scarica i dati meteo
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await weatherRes.json();
                const current = weatherData.current_weather;

                // 3. Mostra i risultati a schermo
                document.getElementById('city-display').innerText = cityName;
                document.getElementById('temp-display').innerText = Math.round(current.temperature) + '°';
                
                // Capisce che tempo fa dai codici
                const code = current.weathercode;
                let condition = "Sereno ☀️";
                if(code >= 1 && code <= 3) condition = "Nuvoloso ☁️";
                if(code >= 45 && code <= 48) condition = "Nebbia 🌫️";
                if(code >= 51 && code <= 67) condition = "Pioggia 🌧️";
                if(code >= 71 && code <= 77) condition = "Neve ❄️";
                if(code >= 95) condition = "Temporale ⛈️";
                
                document.getElementById('condition-display').innerText = condition;
                document.getElementById('wind-display').innerText = `💨 Vento: ${current.windspeed} km/h`;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('weather-result').style.display = 'block';
            } catch (error) {
                alert("Si è verificato un errore di connessione.");
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // Carica il meteo all'apertura dell'app
        getWeather();
    </script>
</body>
</html>
